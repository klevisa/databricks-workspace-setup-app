<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"></path></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"></path></marker>
  </defs>
  <rect x="0" y="0" width="1680" height="1080" fill="#fcfcfb"></rect>
  <text x="40" y="52" font-size="20" font-weight="700" fill="#0b0b0b">Diagram 2 of 4 — Setup / provisioning sequence (one-time, at deployment)</text>
  <text x="40" y="78" font-size="13" fill="#52514e">Runs once when Yahoo stands up the environment · each step runs as a distinct least-privilege team SA (repo phases 2.1–2.6, 3) · watch the PSC PENDING → ACCEPTED round-trip and that the Workspace SA — control-plane-owned — only exists after 2.4</text>
  <g font-size="11.5" fill="#52514e">
    <line x1="1180" y1="44" x2="1208" y2="44" stroke="#2a78d6" stroke-width="2.5"></line><text x="1214" y="48">Deployer (Yahoo) actions</text>
    <line x1="1390" y1="44" x2="1418" y2="44" stroke="#eb6834" stroke-width="2.5"></line><text x="1424" y="48">Databricks-side actions · dashed = response</text>
  </g>

  <g>
    <rect x="55" y="110" width="190" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9"></rect>
    <text x="150" y="133" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Deployer</text>
    <text x="150" y="151" font-size="10" fill="#52514e" text-anchor="middle">Terraform · per-phase SAs</text>
    <rect x="425" y="110" width="190" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9"></rect>
    <text x="520" y="133" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Host project</text>
    <text x="520" y="151" font-size="10" fill="#52514e" text-anchor="middle">Shared VPC (network)</text>
    <rect x="735" y="110" width="190" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9"></rect>
    <text x="830" y="133" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Service project</text>
    <text x="830" y="151" font-size="10" fill="#52514e" text-anchor="middle">KMS · GCS · Compute SA</text>
    <rect x="1015" y="110" width="190" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9"></rect>
    <text x="1110" y="133" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Databricks Account API</text>
    <text x="1110" y="151" font-size="10" fill="#52514e" text-anchor="middle">accounts.gcp.databricks.com</text>
    <rect x="1265" y="110" width="190" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9"></rect>
    <text x="1360" y="133" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Control plane</text>
    <text x="1360" y="151" font-size="10" fill="#52514e" text-anchor="middle">PSC attachments · owns WS SA</text>
    <rect x="1465" y="110" width="190" height="56" rx="8" fill="#ffffff" stroke="#e1e0d9"></rect>
    <text x="1560" y="133" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">VPC-SC perimeter</text>
    <text x="1560" y="151" font-size="10" fill="#52514e" text-anchor="middle">ingress policy</text>
  </g>
  <g stroke="#c3c2b7" stroke-dasharray="4 4">
    <line x1="150" y1="166" x2="150" y2="960"></line>
    <line x1="520" y1="166" x2="520" y2="960"></line>
    <line x1="830" y1="166" x2="830" y2="960"></line>
    <line x1="1110" y1="166" x2="1110" y2="960"></line>
    <line x1="1360" y1="166" x2="1360" y2="960"></line>
    <line x1="1560" y1="166" x2="1560" y2="960"></line>
  </g>

  <g font-size="11.5">
    <line x1="150" y1="210" x2="826" y2="210" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="490" y="202" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.1</tspan>  Create service project · enable APIs · attach to Shared VPC</text>

    <line x1="150" y1="260" x2="516" y2="260" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="335" y="238" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.2</tspan>  VPC · node + PSC subnets · firewall ·</text>
    <text x="335" y="252" fill="#52514e" text-anchor="middle">Router / NAT · private DNS zone</text>

    <line x1="150" y1="310" x2="516" y2="310" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="335" y="288" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.2</tspan>  Create frontend + backend PSC endpoints</text>
    <text x="335" y="302" fill="#52514e" text-anchor="middle">→ status <tspan font-weight="700" fill="#d03b3b">PENDING</tspan></text>

    <line x1="150" y1="360" x2="826" y2="360" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="490" y="338" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.3</tspan>  Create CMEK keyring + key · grant compute / storage</text>
    <text x="490" y="352" fill="#52514e" text-anchor="middle">service agents encrypt / decrypt (STORAGE)</text>

    <line x1="150" y1="410" x2="1106" y2="410" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="630" y="388" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.4</tspan>  Register CMEK · PSC endpoints (mws_vpc_endpoint) · private access settings ·</text>
    <text x="630" y="402" fill="#52514e" text-anchor="middle">network config → create workspace</text>

    <line x1="1110" y1="460" x2="1356" y2="460" stroke="#eb6834" stroke-width="2" marker-end="url(#arr-orange)"></line>
    <text x="1233" y="452" fill="#52514e" text-anchor="middle">Register endpoints against the workspace</text>

    <line x1="1360" y1="510" x2="524" y2="510" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-orange)"></line>
    <text x="940" y="502" fill="#52514e" text-anchor="middle">PSC connections auto-approved → endpoints <tspan font-weight="700" fill="#1baf7a">ACCEPTED</tspan>  <tspan font-size="10" font-weight="700" fill="#d03b3b">crosses B4</tspan></text>

    <line x1="1110" y1="560" x2="154" y2="560" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-orange)"></line>
    <text x="630" y="552" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#eb6834">2.4</tspan>  Workspace created → returns Workspace SA  db-&lt;id&gt;@prod-gcp-&lt;region&gt;…  (control-plane-owned)</text>

    <line x1="100" y1="586" x2="1600" y2="586" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="2 4"></line>
    <text x="1600" y="581" font-size="10" font-weight="600" fill="#898781" text-anchor="end">the Workspace SA exists only from here — a control-plane SA; 2.5 / 2.6 grant it rights to act in Yahoo's projects</text>

    <line x1="150" y1="626" x2="516" y2="626" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="335" y="604" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.5</tspan>  Grant Workspace SA compute.networkUser</text>
    <text x="335" y="618" fill="#52514e" text-anchor="middle">on the node subnet</text>

    <line x1="150" y1="676" x2="516" y2="676" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="335" y="654" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.5</tspan>  Write 4 private DNS A-records</text>
    <text x="335" y="668" fill="#52514e" text-anchor="middle">(frontend / backend endpoint IPs)</text>

    <line x1="150" y1="726" x2="826" y2="726" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="490" y="704" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">2.6</tspan>  Grant Workspace SA encrypterDecrypter on the</text>
    <text x="490" y="718" fill="#52514e" text-anchor="middle">CMEK key (MANAGED_SERVICES use case)</text>

    <line x1="150" y1="776" x2="1106" y2="776" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="630" y="768" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">3</tspan>  Create storage credentials → generates vended UC storage-credential SA(s)</text>

    <line x1="150" y1="826" x2="826" y2="826" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="490" y="804" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">3</tspan>  Grant UC SA bucket IAM on the data buckets</text>
    <text x="490" y="818" fill="#52514e" text-anchor="middle">(RO: objectViewer + legacyBucketReader · RW: objectAdmin)</text>

    <line x1="150" y1="876" x2="1556" y2="876" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="855" y="868" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">3</tspan>  Add VPC-SC ingress rules: identity = UC SA only · methods scoped · source = Databricks project numbers</text>

    <line x1="150" y1="926" x2="1106" y2="926" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr-blue)"></line>
    <text x="630" y="918" fill="#52514e" text-anchor="middle"><tspan font-weight="700" fill="#2a78d6">3</tspan>  Create external locations + catalogs (creation validates bucket reachability end-to-end)</text>
  </g>

  <line x1="40" y1="990" x2="1640" y2="990" stroke="#e1e0d9"></line>
  <text x="40" y="1016" font-size="11" fill="#52514e">The PENDING → ACCEPTED round-trip (rows 2.2 → auto-approval) proves the PSC wiring; the endpoints stay PENDING until registered in the account at 2.4. B4 = Databricks account plane acting into Yahoo projects during provisioning.</text>
  <text x="40" y="1036" font-size="11" fill="#52514e">The Compute SA (what the VMs run as) is a GCE default identity in the service project — it isn't provisioned here, so it doesn't appear in this sequence. After the last row the environment is fully provisioned.</text>
  <text x="40" y="1058" font-size="10" fill="#898781">Sources: github.com/klevisa/shared-vpc-cmk-psc-databricks-deployment (phases 2.1–2.6, 3) · github.com/bhavink/databricks (gcpdb4u byovpc-psc-cmek-ws) · Generated 2026-09-04</text>
</svg>