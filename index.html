<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Databricks Workspace Setup App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Databricks Workspace Setup</h1>
      <p class="tagline">Client-side scaffold — start building here.</p>
    </header>

    <section class="card">
      <p>
        This is a placeholder page served as a static site (HTML + JS only).
        Replace the contents of <code>index.html</code>, <code>app.js</code>, and
        <code>style.css</code> with your app.
      </p>
      <p>
        Everything runs in the browser: no server, no build step, no secrets.
      </p>
      <button id="ping" type="button">Ping</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <footer>
      <span id="loaded"></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
